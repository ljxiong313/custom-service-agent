# =============================================================================
# 多店反向代理（nginx）——一份 server 一个店，按域名分到各店容器的宿主端口
# -----------------------------------------------------------------------------
# 装到 /etc/nginx/conf.d/cs-agent.conf 后 `nginx -t && nginx -s reload`。
# 每店改三处：server_name、public_base_url 对应的域名、proxy_pass 的端口。
# 证书用 certbot 或平台给的证书，路径按你的实际填（这里写的是常见位置）。
#
# 这个文件里最要紧的是 chat 那一段的四行"关缓冲"配置：
#   对话接口 POST /api/v1/chat/completions 是 SSE（text/event-stream，逐字往外吐）。
#   nginx 默认会缓冲上游响应，症状是"回答整段憋到最后一次性出来"，甚至超时 504——
#   不是报错，只是体验塌掉，日志里看不出来，所以别照抄网上的通用站配置省事。
#   后端已在响应里带 X-Accel-Buffering: no（nginx 会认），这里再显式写一遍：
#   换网关/换版本时不至于因为一个头没人认而翻车。
# =============================================================================

# 各店容器绑在 127.0.0.1 的不同端口上（见 docker-compose.shop.yml 的 ports）
upstream cs_shop_a { server 127.0.0.1:7861; keepalive 16; }
upstream cs_shop_b { server 127.0.0.1:7862; keepalive 16; }

# 平台回调（淘宝/京东/拼多多/抖店、企微）都要看得到"真实来源 IP"：
# 应用侧的限流键在 trust_proxy_headers: true 时取 X-Forwarded-For 首跳，
# 所以下面必须用 XFF 而不是 X-Real-IP 单独传，且别让客户端能伪造它。
# 若这台 nginx 前面还有云 LB，把 real_ip 那段解开并填 LB 的网段。
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;

server {
    listen 443 ssl http2;
    server_name cs-a.example.com;

    ssl_certificate     /etc/letsencrypt/live/cs-a.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cs-a.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 知识库上传上限是后端定的 20MB（app/api/v1/knowledge.py:25 MAX_SIZE）。
    # 这里给 25m：让"超限"由应用返回可读的 413 文案，而不是 nginx 的默认错误页。
    client_max_body_size 25m;

    # 平台回调的报文里可能带中文与大附件，超时给足；签名是对 body 算的，代理不要改 body。
    location /api/platform/ {
        proxy_pass http://cs_shop_a;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
        # 重推是平台侧行为，代理不要再自己重试一遍（会把同一条消息投两次）
        proxy_next_upstream off;
    }

    # 企微回调同理
    location /api/wecom/ {
        proxy_pass http://cs_shop_a;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
    }

    # ---- 对话（SSE）：这一段是重点 ----
    location = /api/v1/chat/completions {
        proxy_pass http://cs_shop_a;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";        # keepalive，别把 SSE 掐成一次性连接
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering          off;                 # 关了才是一个字一个字往下走
        proxy_cache              off;
        gzip                     off;                 # 对已压缩的流再压一遍只会攒块
        chunked_transfer_encoding on;
        proxy_connect_timeout    10s;
        proxy_read_timeout       300s;                # > 后端 llm.request_timeout_seconds，否则模型慢一点就被代理先断
        proxy_send_timeout       300s;
    }

    # 附件是"签名 URL + 有效期"的私有文件，绝不能被代理缓存（缓存住了等于把链接换给下一个访问者）
    location /api/files/ {
        proxy_pass http://cs_shop_a;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    # 内部指标与就绪探针不暴露到公网：只允许本机/监控网段来抓
    location = /metrics {
        allow 127.0.0.1;
        # allow 10.0.0.0/8;        # 你的 Prometheus 所在网段
        deny all;
        proxy_pass http://cs_shop_a;
        proxy_set_header Host $host;
    }
    location = /ready {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://cs_shop_a;
        proxy_set_header Host $host;
    }

    # 其余：客服台前端（后端同源挂 dist，见 server.serve_frontend）
    location / {
        proxy_pass http://cs_shop_a;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl http2;
    server_name cs-b.example.com;

    ssl_certificate     /etc/letsencrypt/live/cs-b.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cs-b.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    # 与店 A 完全同构，只把 upstream 换成 cs_shop_b。
    # 三店以上就别复制了：把公共部分抽成 /etc/nginx/snippets/cs-agent-proxy.conf，
    # 用 fastcgi_pass 式的 include + 变量 upstream 传店名；下面是可直接替换的做法。
    location /api/v1/chat/completions {
        proxy_pass http://cs_shop_b;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / {
        proxy_pass http://cs_shop_b;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS（平台回调只走 https，别留 80 明文入口）
server {
    listen 80;
    server_name cs-a.example.com cs-b.example.com;
    return 301 https://$host$request_uri;
}
