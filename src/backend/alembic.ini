# Alembic configuration (production schema migrations; dev still uses create_all by default).
#
# NOTE ON THIS FILE'S ENCODING: Alembic reads the ini with the *locale* encoding
# (``ConfigParser.read(..., encoding="locale")``), which on a Chinese Windows is GBK.
# Non-ASCII comments here would therefore crash every alembic command on that machine,
# so this file stays ASCII and the Chinese prose lives in migrations/env.py instead.
#
# Commands (script_location / prepend_sys_path are anchored to this file's directory
# src/backend via %(here)s, so they work from the repo root as well):
#   py -m alembic -c src/backend/alembic.ini upgrade head
#   py -m alembic -c src/backend/alembic.ini current
#   py -m alembic -c src/backend/alembic.ini revision --rev-id 0002 --autogenerate -m "add x"
#   py -m alembic -c src/backend/alembic.ini upgrade head --sql
#   py -m alembic -c src/backend/alembic.ini check   # autogenerate diff must be empty; CI gate
# Conventions: revision ids are hand-numbered and monotonic (pass --rev-id 0002/0003/...),
# autogenerate output is a draft that must be reviewed before it is committed, and
# destructive changes (drop column / change type) need a separate review.

[alembic]
# where the migration scripts live
script_location = %(here)s/migrations
# defaults to <script_location>/versions, spelled out for readability
version_locations = %(here)s/migrations/versions
# generated file name: <revision id>_<slug>.py (revision id comes from --rev-id)
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
# put src/backend on sys.path so env.py can import app.* from any cwd
prepend_sys_path = %(here)s
# separator used for the multi-path options above
path_separator = os
# versions/ is flat on purpose; recursive lookup would hide misplaced files as silent branches
recursive_version_locations = false
# env.py only needs a live connection for --autogenerate, keep the default
revision_environment = false
# Create Date stays in local time: a fixed zone adds noise unrelated to the schema
# timezone =
output_encoding = utf-8

# sqlalchemy.url is deliberately NOT set here: the single source of the URL is
# app.config's database.url (see migrations/env.py, it reuses app.db.session's engine).
# The CLI therefore always follows CS_CONFIG / config.simple.yaml; to point at another
# database from Python (tests do this), set the option before calling a command:
#   cfg = Config("src/backend/alembic.ini")
#   cfg.set_main_option("sqlalchemy.url", "sqlite:///" + abs_tmp_path)   # absolute!
#   command.upgrade(cfg, "head")
# There is no -o/--set-option flag in this Alembic version, so a one-off URL from the shell
# is done by pointing CS_CONFIG at a config file that carries that url.
